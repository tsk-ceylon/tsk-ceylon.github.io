name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Taken down at the owner's request: publish an empty site, so every URL
      # returns a 404 and search engines drop the pages. The site code is untouched;
      # revert this commit and 5da1643 to restore it.
      - run: mkdir empty
      - uses: actions/upload-pages-artifact@v3
        with:
          path: empty
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
