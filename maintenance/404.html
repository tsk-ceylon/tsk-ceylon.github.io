<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TSK Ceylon</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --color-action: #DC2626;
      --color-navy: #14213D;
      --color-navy-soft: #1E3050;
      --color-text: #F4F7FA;
      --color-muted: #A9B4C6;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--color-navy);
      color: var(--color-text);
      font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 32rem; text-align: center; }
    .mark {
      width: 3rem;
      height: 0.25rem;
      margin: 0 auto 1.75rem;
      background: var(--color-action);
      border-radius: 999px;
    }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
    p { margin-top: 1rem; line-height: 1.6; color: var(--color-muted); }
    .brand {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>We'll be back soon</h1>
    <p>Our website is temporarily unavailable. Thank you for your patience.</p>
    <p class="brand">TSK Ceylon (Pvt) Ltd</p>
  </main>
</body>
</html>
